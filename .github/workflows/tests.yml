name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
        os: ['ubuntu-24.04']
        include:
          - python-version: '3.8'
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m py_compile inventory.py inventory_cycle.py inventory_store.py netbox_inventory.py inventory_web.py inventory_web_demo.py
      - name: Run tests with synthetic data
        run: python -m unittest discover -s tests -v
      - name: Verify systemd units
        if: matrix.python-version == '3.12'
        run: systemd-analyze verify deploy/systemd/opennms-software-inventory.service deploy/systemd/opennms-software-inventory.timer
      - name: Check JavaScript syntax
        if: matrix.python-version == '3.12'
        run: |
          node --check web/app.js
          node --check web/mapping.js
          node --test tests/test_mapping.cjs
